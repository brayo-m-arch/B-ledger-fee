  /* ---------------- Admin: approvals, who entered / who accepted, accounts ---------------- */

  function fmtStamp(iso){ return iso ? new Date(iso).toLocaleString() : "-"; }

  function collectPaymentItems(){
    var items = [];
    db.classes.forEach(function(cl){
      cl.terms.forEach(function(t){
        t.payments.forEach(function(p){
          var st = cl.students.find(function(s){ return s.id === p.studentId; });
          items.push({ p: p, type: cl.name + " - " + t.label + " " + termYear(t), who: st ? st.name : "(removed student)" });
        });
      });
    });
    return items;
  }
  function ledgerPendingCount(data){
    var n = 0;
    (data.classes || []).forEach(function(cl){ cl.terms.forEach(function(t){ t.payments.forEach(function(p){ if(p.status === "pending") n++; }); }); });
    return n;
  }
  function pendingItems(){
    return collectPaymentItems().filter(function(i){ return i.p.status === "pending"; });
  }
  function markDecision(p, approve){
    var a = currentActor();
    p.status = approve ? "approved" : "rejected";
    p.decidedBy = a.name; p.decidedRole = a.role; p.decidedAt = new Date().toISOString();
  }
  function acceptedByText(p){
    if(p.direct) return "Entered directly (no approval needed)";
    if(p.status === "pending") return "Awaiting approval";
    if(!p.decidedBy) return "-";
    return (p.status === "rejected" ? "Rejected by " : "") + whoText(p.decidedBy, p.decidedRole) + " on " + fmtStamp(p.decidedAt);
  }
  function statusHtml(p){
    if(p.status === "pending") return '<span class="tag" style="margin-left:0;">Pending</span>';
    if(p.status === "rejected") return '<span class="balance-owing">Rejected</span>';
    return '<span class="balance-clear">Approved</span>';
  }

  function bindApprovals(c, pending, refresh){
    c.querySelectorAll("[data-approve]").forEach(function(btn){
      btn.onclick = function(){
        var it = pending[Number(btn.getAttribute("data-approve"))];
        if(!it) return;
        markDecision(it.p, true);
        addMessage(sdata(), actorLabel(), "Approved " + money(it.p.amount) + " for " + it.who + " (" + it.type + ") dated " + it.p.date + ", entered by " + (it.p.enteredBy || "unknown") + ".");
        refresh();
      };
    });
    c.querySelectorAll("[data-reject]").forEach(function(btn){
      btn.onclick = function(){
        var it = pending[Number(btn.getAttribute("data-reject"))];
        if(!it) return;
        if(!confirm("Reject this payment? It will not be added to the account.")) return;
        markDecision(it.p, false);
        addMessage(sdata(), actorLabel(), "Rejected " + money(it.p.amount) + " for " + it.who + " (" + it.type + ") dated " + it.p.date + ", entered by " + (it.p.enteredBy || "unknown") + ".");
        refresh();
      };
    });
    var approveAllBtn = c.querySelector("#approveAllBtn");
    if(approveAllBtn){
      approveAllBtn.onclick = function(){
        if(!confirm("Approve all " + pending.length + " payments awaiting approval?")) return;
        var total = 0;
        pending.forEach(function(it){ markDecision(it.p, true); total += Number(it.p.amount||0); });
        addMessage(sdata(), actorLabel(), "Approved " + pending.length + " payment(s) totalling " + money(total) + ".");
        refresh();
      };
    }
  }

  function renderAdmin(c){
    var school = currentSchool();
    var items = collectPaymentItems();
    var pending = items.filter(function(i){ return i.p.status === "pending"; })
      .sort(function(a,b){ return String(a.p.enteredAt || a.p.date).localeCompare(String(b.p.enteredAt || b.p.date)); });

    var html = '<h2 class="section-title">Admin'+(currentSection === "collections" && getCurrentCollection() ? ' &mdash; ' + esc(getCurrentCollection().name) : '')+'</h2>' +
      '<p class="section-hint">Approve or reject payments before they are added to the account, see who entered and who accepted each one, and manage the clerk and school admin accounts. This list shows only the ledger you are in; every collection keeps its own.</p>';

    html += '<div class="panel"><h3>Payments awaiting approval</h3>';
    if(pending.length === 0){
      html += '<p class="section-hint" style="margin:0;">Nothing is waiting for approval.</p>';
    } else {
      html += '<p class="section-hint" style="margin:0 0 10px;">These amounts are not counted in any balance or total until they are approved.</p>' +
        '<div style="text-align:right;margin-bottom:10px;"><button class="btn" id="approveAllBtn">Approve all ('+pending.length+')</button></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Payment date</th><th>For</th><th>Student / From</th><th class="num">Amount</th><th>Entered by</th><th>Entered on</th><th style="width:180px;"></th></tr></thead><tbody>';
      pending.forEach(function(it, i){
        html += '<tr><td>'+esc(it.p.date)+'</td><td>'+esc(it.type)+'</td><td>'+esc(it.who)+'</td><td class="num">'+money(it.p.amount)+'</td>' +
          '<td>'+esc(whoText(it.p.enteredBy, it.p.enteredRole))+'</td><td>'+esc(fmtStamp(it.p.enteredAt))+'</td>' +
          '<td><button class="btn" data-approve="'+i+'" style="padding:5px 10px;">Approve</button> <button class="btn danger" data-reject="'+i+'" style="padding:5px 10px;">Reject</button></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    var records = items.slice().sort(function(a,b){ return String(b.p.enteredAt || b.p.date).localeCompare(String(a.p.enteredAt || a.p.date)); });
    html += '<div class="panel"><h3>Remedial fee payment records - who entered and who accepted</h3>';
    if(records.length === 0){
      html += '<p class="section-hint" style="margin:0;">No payments recorded yet.</p>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>Entered on</th><th>Payment date</th><th>For</th><th>Student / From</th><th class="num">Amount</th><th>Status</th><th>Entered by</th><th>Accepted by</th></tr></thead><tbody>';
      records.slice(0, 300).forEach(function(it){
        var p = it.p;
        html += '<tr><td>'+esc(fmtStamp(p.enteredAt))+'</td><td>'+esc(p.date)+'</td><td>'+esc(it.type)+'</td><td>'+esc(it.who)+'</td>' +
          '<td class="num">'+money(p.amount)+'</td><td>'+statusHtml(p)+'</td>' +
          '<td>'+esc(whoText(p.enteredBy, p.enteredRole))+'</td><td>'+esc(acceptedByText(p))+'</td></tr>';
      });
      html += '</tbody></table></div>';
      if(records.length > 300) html += '<p class="section-hint" style="margin:10px 0 0;">Showing the most recent 300 of '+records.length+' payments.</p>';
    }
    html += '</div>';

    var canEdit = session.role === "schooladmin" || !(school.adminUsername && school.adminPassword);
    html += '<div class="panel"><h3>School accounts</h3>' +
      '<p class="section-hint" style="margin:0 0 10px;">Each school has a clerk account and a school admin account. Both can approve payments.' + (canEdit ? '' : ' Only the school admin can change these details.') + '</p>' +
      '<div class="table-wrap"><table><thead><tr><th>Account</th><th>Username</th><th>Password</th></tr></thead><tbody>';
    if(canEdit){
      html += '<tr><td>Clerk</td><td><input type="text" id="acctClerkUser" value="'+esc(school.clerkUsername)+'" style="width:100%"></td>' +
        '<td><input type="text" id="acctClerkPass" value="'+esc(school.clerkPassword)+'" style="width:100%"></td></tr>' +
        '<tr><td>School Admin</td><td><input type="text" id="acctAdminUser" value="'+esc(school.adminUsername||"")+'" placeholder="set admin username" style="width:100%"></td>' +
        '<td><input type="text" id="acctAdminPass" value="'+esc(school.adminPassword||"")+'" placeholder="set admin password" style="width:100%"></td></tr>';
    } else {
      html += '<tr><td>Clerk</td><td>'+esc(school.clerkUsername)+'</td><td>&bull;&bull;&bull;&bull;&bull;&bull;</td></tr>' +
        '<tr><td>School Admin</td><td>'+esc(school.adminUsername)+'</td><td>&bull;&bull;&bull;&bull;&bull;&bull;</td></tr>';
    }
    html += '</tbody></table></div></div>';

    c.innerHTML = html;

    function refresh(){ saveDB(); renderClerkShell(); renderClerkTab(); }
    bindApprovals(c, pending, refresh);

    if(canEdit){
      c.querySelector("#acctClerkUser").addEventListener("change", function(e){
        var val = e.target.value.trim();
        if(!val){ e.target.value = school.clerkUsername; return; }
        if(isUsernameTaken(val, school, "clerk")){ alert("That username is already in use."); e.target.value = school.clerkUsername; return; }
        school.clerkUsername = val; refresh();
      });
      c.querySelector("#acctClerkPass").addEventListener("change", function(e){
        school.clerkPassword = e.target.value || school.clerkPassword; saveDB();
      });
      c.querySelector("#acctAdminUser").addEventListener("change", function(e){
        var val = e.target.value.trim();
        if(!val){ e.target.value = school.adminUsername || ""; return; }
        if(isUsernameTaken(val, school, "admin")){ alert("That username is already in use."); e.target.value = school.adminUsername || ""; return; }
        school.adminUsername = val; refresh();
      });
      c.querySelector("#acctAdminPass").addEventListener("change", function(e){
        school.adminPassword = e.target.value || school.adminPassword || ""; saveDB();
      });
    }
  }

  /* ---------------- Boot ---------------- */

  function boot(){
    loadSession();
    if(!session.token || !isConfigured()){ renderLogin(isConfigured() ? "" : "This app is not connected to its online database yet. Add the Supabase URL and key in the file."); return; }
    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("loginScreen").innerHTML = '<div class="login-wrap"><div class="login-card"><h1 class="login-title">Ledger Fees</h1><p class="section-hint">Loading your records...</p></div></div>';
    rpc("lf_load", { p_token: session.token }).then(function(info){
      applyLoaded(info);
      if(info.role !== "superadmin"){
        session.schoolId = info.school_id || null; session.classId = info.class_id || null;
        session.ledgerId = info.ledger_id || null; session.memberId = info.member_id || null;
      }
      var validClerk = (session.role === "clerk" || session.role === "schooladmin") && currentSchool();
      var validTeacher = session.role === "classteacher" && currentSchool() && !!findClassEntry(currentSchool(), session.classId);
      var validCommittee = session.role === "committee" && currentSchool() && !!findCommitteeMember(currentSchool(), session.ledgerId, session.memberId);
      if(session.role === "superadmin" || validClerk || validTeacher || validCommittee){ startApp(); offerLocalImport(); }
      else { session = { role:null, schoolId:null, classId:null }; saveSession(); renderLogin(); }
    }).catch(function(e){
      var m = String((e && e.message) || "");
      if(m.indexOf("SESSION_EXPIRED") >= 0){ session = { role:null, schoolId:null, classId:null }; saveSession(); renderLogin("Your session has expired. Please sign in again."); }
      else { renderLogin("Could not connect. Check your internet connection and reload."); }
    });
  }
  boot();
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(e){ console.warn("SW failed", e); });
  });
}
</script>
</body>
</html>
